server {
	listen		8091;
	server_name	localhost;
    location / {
        root   /home/usr/local/projects/falali/frontend/dist;
        index  index.html index.htm;
        # 用于配合前端路由为h5模式使用，防止刷新404 https://router.vuejs.org/zh/guide/essentials/history-mode.html#nginx
        try_files $uri $uri/ /index.html;

            # 禁用缓存
        #add_header Cache-Control "no-cache, no-store, must-revalidate";
        #add_header Pragma "no-cache";
        # add_header Expires 0;
    }
    # 第一个代理后端地址（vite.config.ts里叫 /api，这里也要保持一致）
    location /api {
        # 如果后端在本地比如127.0.0.1或者localhost请解开下面的rewrite注释即可
        # rewrite  ^.+api/?(.*)$ /$1 break;
        # 这里填写后端地址（后面一定不要忘记添加 / ）
        proxy_pass http://127.0.0.1:8090/api;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect default;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers X-Requested-With;
        add_header Access-Control-Allow-Methods GET,POST,OPTIONS;


    	proxy_connect_timeout 300s;
    	proxy_send_timeout    300s;
    	proxy_read_timeout    300s;   # ✅ 最重要，等上游返回响应的最大时间
    	send_timeout          300s;

    	# 如果有缓存层，也可能需要加
    	proxy_buffering off;

    }

}
